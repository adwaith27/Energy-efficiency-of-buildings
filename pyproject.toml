[project]
name = "energy-efficiency"
version = "0.1.0"
description = "Regression modeling and Grafana monitoring for the ENB2012 building energy-efficiency dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "prometheus-client>=0.19",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "mlxtend>=0.23",
    "seaborn>=0.13",
]

[project.scripts]
energy-train = "train:main"
energy-metrics = "metrics_server:main"

[tool.uv]
package = false
